<!doctype html>
<html lang="uz">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>HypeGram</title><link rel="icon" href="icons/128.png"><link rel="stylesheet" href="onboarding.css"></head>
<body>
  <header><img src="icons/128.png" alt=""><span>HypeGram</span><div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div></header>
  <main>
    <section class="step">
      <div class="orbit" aria-hidden="true"><i></i><i></i><b></b></div>
      <h1 data-t="line"></h1><p data-t="intro"></p>
      <div class="langs"><button type="button" data-lang="uz">O'zbekcha</button><button type="button" data-lang="ru">Русский</button><button type="button" data-lang="en">English</button></div>
    </section>
    <section class="step" hidden>
      <h1 data-t="pickTitle"></h1><p data-t="pickText"></p>
      <div class="cards">
        <button type="button" data-preset="clean"><strong data-t="clean"></strong><span data-t="cleanText"></span></button>
        <button type="button" data-preset="quality"><strong data-t="quality"></strong><span data-t="qualityText"></span></button>
        <button type="button" data-preset="focus"><strong data-t="focus"></strong><span data-t="focusText"></span></button>
      </div>
    </section>
    <section class="step" hidden>
      <h1 data-t="blockTitle"></h1><p data-t="blockText"></p>
      <textarea id="words" rows="5" placeholder="#hashtag"></textarea>
    </section>
    <section class="step" hidden>
      <h1 data-t="doneTitle"></h1><p data-t="doneText"></p>
      <p class="note" data-t="note"></p>
      <a class="primary" href="https://www.instagram.com/" data-t="open"></a>
    </section>
  </main>
  <footer><button type="button" id="back" data-t="back"></button><button type="button" id="next" class="primary" data-t="next"></button></footer>
  <script src="filter.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
