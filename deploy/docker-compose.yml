name: elakly
services:
  web:
    image: nginx:alpine
    container_name: elakly-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8121:80"
    volumes:
      - ../site/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: elakly-tunnel
    restart: unless-stopped
    # config.yml and the credentials file live outside the repo, in ~/elakly-tunnel
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run elakly
    volumes:
      - ${HOME}/elakly-tunnel:/etc/cloudflared:ro
    depends_on:
      - web
    mem_limit: 128m
